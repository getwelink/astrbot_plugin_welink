name: astrbot_plugin_welink
display_name: WeLink 微信个人号
short_desc: 把微信个人号接入 AstrBot，支持私聊和群聊，不需要公网地址
desc: |
  WeLink 微信个人号适配器。安装后，AstrBot 的「平台适配器」中会新增 welink 类型，可以把一个微信个人号接入 AstrBot。

  - 支持 WebSocket 实时推送及 HTTP 轮询，无需公网地址
  - 私聊直接回复；群聊中 @ 机器人或发送 /help 这类命令时回复
  - 支持收发文字、图片、语音和文件，AI 生成的图片可以直接发送
  - 近期事件去重，不回复系统消息和公众号，并能防止和其他自动回复互相刷屏

  使用前需要一个 WeLink 的 API Key，申请方式见仓库说明。
version: 0.2.0
author: getwelink
repo: https://github.com/getwelink/astrbot_plugin_welink
astrbot_version: ">=4.14.0"
social_link: https://github.com/getwelink/weLink
